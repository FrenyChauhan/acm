<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="diamondGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6ec6e6"/>
      <stop offset="100%" stop-color="#2e8bbf"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7dcde8"/>
      <stop offset="100%" stop-color="#3a9fd4"/>
    </linearGradient>
    <clipPath id="diamondClip">
      <polygon points="50,2 98,50 50,98 2,50"/>
    </clipPath>
  </defs>

  <!-- Diamond shape -->
  <polygon points="50,2 98,50 50,98 2,50" fill="url(#diamondGrad)"/>

  <!-- White circle ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="white" stroke-width="4"/>

  <!-- Circle fill (gradient) clipped to diamond -->
  <circle cx="50" cy="50" r="30" fill="url(#circleGrad)" clip-path="url(#diamondClip)"/>

  <!-- "acm" text -->
  <text
    x="50"
    y="56"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="bold"
    fill="white"
    letter-spacing="-0.5"
  >acm</text>
</svg>
